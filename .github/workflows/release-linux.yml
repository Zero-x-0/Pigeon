name: Linux & Windows Release Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libssl-dev rpm file python3

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Compile Release Binary
        run: cargo build --release -p pigeon

      - name: Build Debian Package (.deb)
        run: python3 dist/linux/package_deb.py

      - name: Build RPM Package (.rpm)
        run: python3 dist/linux/package_rpm.py

      - name: Build AppImage (.AppImage)
        run: python3 dist/linux/package_appimage.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-packages
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.AppImage

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
