name: Automatic Release Packaging & Publishing

on:
  release:
    types: [published, created]
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Package Linux Binaries
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libssl-dev rpm file python3

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Compile Linux Release Binary
        run: cargo build --release -p pigeon

      - name: Build Debian Package (.deb)
        run: python3 dist/linux/package_deb.py

      - name: Build RPM Package (.rpm)
        run: python3 dist/linux/package_rpm.py

      - name: Build AppImage (.AppImage)
        run: python3 dist/linux/package_appimage.py

      - name: Upload Linux Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Add MinGW tools to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Rust Toolchain (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Compile Windows Release Binary
        run: cargo build --release -p pigeon --target x86_64-pc-windows-gnu

      - name: Prepare Windows Executable Packages
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "target/x86_64-pc-windows-gnu/release/pigeon.exe" "release/pigeon-1.11.0-windows-x64.exe" -Force
          Copy-Item "target/x86_64-pc-windows-gnu/release/pigeon.exe" "release/pigeon.exe" -Force

      - name: Upload Windows Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            release/pigeon-1.11.0-windows-x64.exe
            release/pigeon.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

