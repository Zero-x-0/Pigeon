name: CI & Automatic Release Deployment

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'release-*'
  pull_request:
    branches: [main]
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Check & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libssl-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check Workspace
        run: cargo check --workspace --all-targets

      - name: Run Workspace Unit Tests
        run: cargo test --workspace

  build-linux:
    name: Build Linux Packages (.AppImage, .deb, .rpm)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libssl-dev rpm file python3

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build All Linux Release Packages
        run: bash dist/linux/build-all-linux.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pigeon-linux-packages
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm

  build-windows:
    name: Build Windows Executable (.exe)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Add MinGW tools to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Rust Toolchain (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Compile Windows Release Binary
        run: cargo build --release -p pigeon --target x86_64-pc-windows-gnu

      - name: Stage Windows Executables
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p release
          cp -f "target/x86_64-pc-windows-gnu/release/pigeon.exe" "release/pigeon-${VERSION}-windows-x64.exe"
          cp -f "target/x86_64-pc-windows-gnu/release/pigeon.exe" "release/pigeon.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pigeon-windows-packages
          path: |
            release/*.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Version & Tag
        id: meta
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 Checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach Release Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Pigeon v${{ steps.meta.outputs.version }}"
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
