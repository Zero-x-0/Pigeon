[workspace]
resolver = "2"
members = [
    "crates/usb-x-core",
    "crates/usb-x-image",
    "crates/usb-x-platform",
    "crates/usb-x-engine",
    "crates/usb-x-catalog",
    "crates/usb-x-app",
]

[workspace.package]
edition = "2021"
version = "1.11.26"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

